<!DOCTYPE html>
<html>

<head>
  <title>Dom Projects</title>
  <style>
    body {
      font-family: Arial;
    }

    .subscribe-button {
      color: white;
      background-color: black;
      border: none;
      border-radius: 20px;
      padding: 10px;
      margin-bottom: 29px;
      cursor: pointer;
    }

    .input-button {
      padding: 10px;
      font-size: 15px;
      margin-bottom: 30px;
    }

    .calculate-button {
      color: white;
      background-color: rgb(10, 179, 52);
      border: none;
      padding: 12px 15px;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <p>Youtube Subscribe Button</p>
  <button onclick="
        subscribe();
        " class="js-subscribe-button subscribe-button">
    <strong>Subscribe</strong>
  </button>

  <p>Amazon Shipping Calculator</p>
  <p>Orders under $40 = +$10 shipping.</p>
  <p>Orders under $40 = FREE shipping.</p>
  <input placeholder="Cost of order" class="js-cost-input input-button" onkeydown="
    handelCostKeyDown(event);
    ">
  <button onclick="
    calculateTotal();
    " class="calculate-button">Calculate</button>

  <p class="js-total-cost"></p>
  <p>ROCK PAPER SCISSORS</p>

  <script>

    function handelCostKeyDown(event) {
      if (event.key === 'Enter') {
        calculateTotal();
      }
    }

    function calculateTotal() {
      const inputElement = document.querySelector('.js-cost-input');
      let cost = Number(inputElement.value);

      if (cost < 40) {
        cost = cost + 10;
      }

      document.querySelector('.js-total-cost')
        .innerHTML = `$${cost}`;
    }


    function subscribe() {
      const buttonElement = document.querySelector('.js-subscribe-button');

      if (buttonElement.innerText === 'Subscribe') {
        buttonElement.innerHTML = 'Subscribed';
      } else {
        buttonElement.innerHTML = 'Subscribe'
      }
    }

  </script>
</body>

</html>
